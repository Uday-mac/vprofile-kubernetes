apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprofile-frontend
  labels:
    app: vproapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vproapp
  template:
    metadata:
      labels:
        app: vproapp
    spec:
      containers:
      - name: vproapp
        image: udaydevmac/vprofile-app:v1.0.0
        ports:
        - containerPort: 8080
      initContainers:
      - name: db-connection
        image: busybox
        command: ['sh', '-c', "until nslookup db01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for myservice; sleep 2; done"] 
      - name: memcached-connection
        image: busybox
        command: ['sh', '-c', "until nslookup mc01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for myservice; sleep 2; done"]
      - name: rabbitmq-connection
        image: busybox
        command: ['sh', '-c', "until nslookup rmq01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for myservice; sleep 2; done"]
---
apiVersion: v1
kind: Service
metadata:
  name: vproapp-svc
spec:
  selector:
    app: vproapp
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP